# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  #pull_request:
  #  branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  publish:
    name: Release and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install

      - name: Validate Grammar Structure
        run: |
          npm install --no-save vscode-textmate oniguruma-to-es
          node -e "
          const fs = require('fs');
          try {
            const grammar = JSON.parse(fs.readFileSync('./syntaxes/tyr.tmLanguage.json', 'utf8'));
            if (!grammar.scopeName || !grammar.patterns) {
              throw new Error('Fehlende Basis-Eigenschaften wie scopeName oder patterns.');
            }
            console.log('Grammatik ist strukturell und als JSON wohlgeformt!');
          } catch (err) {
            console.error('Validierungsfehler:', err.message);
            process.exit(1);
          }
          "

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.PUBLISHER_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
